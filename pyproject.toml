[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cegait"
version = "0.1.0"
description = "Cumulative-exposure-aware revocable gait template learning"
requires-python = ">=3.15,<3.16"
dependencies = ["torch>=2.15,<2.16", "numpy>=1.24,<3", "scipy>=1.10,<2", "PyYAML>=6,<7", "cryptography>=41", "Pillow>=10"]

[project.scripts]
cegait = "cegait.cli:main"

[tool.setuptools.packages.find]
include = ["cegait*"]
